<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Snake</title>
<style>
  :root { color-scheme: dark; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html, body { height:100%; margin:0; }
  body { background:radial-gradient(circle at 50% 30%, #14123a, #05060f 70%); color:#e9ecff; font-family:system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none;
    user-select:none; -webkit-user-select:none; overflow:hidden; }
  h1 { font-size:20px; margin:0 0 6px; }
  #score { font-size:18px; margin-bottom:8px; }
  canvas { width:min(92vw, 60vh); height:min(92vw, 60vh); border-radius:16px; border:3px solid #4c4fb8;
    box-shadow:0 0 24px rgba(110,90,255,.5); touch-action:none; }
  p { font-size:14px; opacity:.7; margin:10px 0 0; text-align:center; }
</style>
</head>
<body>
  <h1>🐍 Space Snake</h1>
  <div id="score">Score: 0 &nbsp; Best: 0</div>
  <canvas id="game" width="800" height="800"></canvas>
  <p id="hint">Swipe on the screen to steer. Tap to start.</p>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const hintEl = document.getElementById('hint');

  const W = canvas.width;
  const CELLS = 20;
  const SIZE = W / CELLS;

  let snake, prev, dir, queue, food, score, best = 0;
  let running = false, over = false, lastStep = 0, stepMs = 150, headAngle = 0, particles = [];

  // ----- Space background (drawn once, then reused) -----
  const bg = document.createElement('canvas');
  bg.width = bg.height = W;
  (function makeBackground() {
    const b = bg.getContext('2d');
    const g = b.createLinearGradient(0, 0, 0, W);
    g.addColorStop(0, '#080a2a');
    g.addColorStop(1, '#1a0b3b');
    b.fillStyle = g;
    b.fillRect(0, 0, W, W);
    // soft glowing clouds (nebula)
    [[200, 620, 340, '150,60,220', .28], [620, 180, 320, '40,120,255', .22], [650, 640, 220, '255,80,160', .12]]
      .forEach(([x, y, r, c, a]) => {
        const n = b.createRadialGradient(x, y, 0, x, y, r);
        n.addColorStop(0, 'rgba(' + c + ',' + a + ')');
        n.addColorStop(1, 'rgba(' + c + ',0)');
        b.fillStyle = n;
        b.fillRect(0, 0, W, W);
      });
    // faint tiny stars
    for (let i = 0; i < 140; i++) {
      b.fillStyle = 'rgba(255,255,255,' + (0.15 + Math.random() * 0.3) + ')';
      b.beginPath();
      b.arc(Math.random() * W, Math.random() * W, 0.6 + Math.random() * 0.8, 0, Math.PI * 2);
      b.fill();
    }
  })();

  // twinkling stars (small)
  const starColors = ['#ffffff', '#cfe3ff', '#fff3bf', '#ffd6e7'];
  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * W,
    r: 1 + Math.random() * 1.8,
    ph: Math.random() * 6.28, sp: 0.001 + Math.random() * 0.003,
    c: starColors[Math.floor(Math.random() * starColors.length)]
  }));

  function drawSpace(now) {
    ctx.drawImage(bg, 0, 0);
    stars.forEach(s => {
      ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph));
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ----- Game logic -----
  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    prev = snake.map(s => ({ x: s.x, y: s.y }));
    dir = { x: 1, y: 0 };
    queue = [];
    headAngle = 0;
    score = 0;
    stepMs = 150;
    particles = [];
    over = false;
    placeFood();
    updateScore();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateScore() {
    scoreEl.innerHTML = 'Score: ' + score + ' &nbsp; Best: ' + best;
  }

  function start() {
    reset();
    running = true;
    lastStep = performance.now();
    hintEl.textContent = 'Swipe to steer!';
  }

  function gameOver() {
    running = false;
    over = true;
    if (score > best) best = score;
    updateScore();
    hintEl.textContent = 'Tap to play again.';
    if (navigator.vibrate) navigator.vibrate(200);
  }

  function step(now) {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    prev = snake.map(s => ({ x: s.x, y: s.y }));   // remember old spots for smooth sliding
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      stepMs = Math.max(80, 150 - score * 3);       // gets a little faster
      burst((food.x + 0.5) * SIZE, (food.y + 0.5) * SIZE);
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }
    lastStep = now;
  }

  function burst(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }

  // ----- Drawing -----
  const lerp = (a, b, t) => a + (b - a) * t;

  function drawFood(now) {
    const x = (food.x + 0.5) * SIZE, y = (food.y + 0.5) * SIZE;
    const r = SIZE * 0.3 + Math.sin(now / 200) * SIZE * 0.04;
    ctx.save();
    ctx.shadowColor = '#ffa94d';
    ctx.shadowBlur = 24;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, '#fff3bf');
    g.addColorStop(1, '#ff922b');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHead(p, now) {
    // turn the head smoothly
    const target = Math.atan2(dir.y, dir.x);
    let d = target - headAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    headAngle += d * 0.25;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(headAngle);

    // tongue flicking in and out
    const tl = Math.max(0, Math.sin(now / 110));
    if (tl > 0.05) {
      ctx.strokeStyle = '#ff4d6d';
      ctx.lineWidth = SIZE * 0.07;
      ctx.lineCap = 'round';
      const base = SIZE * 0.42, end = base + SIZE * 0.6 * tl;
      ctx.beginPath();
      ctx.moveTo(base, 0); ctx.lineTo(end, 0);
      ctx.moveTo(end, 0); ctx.lineTo(end + SIZE * 0.2 * tl, -SIZE * 0.16 * tl);
      ctx.moveTo(end, 0); ctx.lineTo(end + SIZE * 0.2 * tl, SIZE * 0.16 * tl);
      ctx.stroke();
    }

    // head
    ctx.shadowColor = '#20c997';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#38d9a9';
    ctx.beginPath();
    ctx.arc(0, 0, SIZE * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // eyes
    [-1, 1].forEach(side => {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(SIZE * 0.12, side * SIZE * 0.24, SIZE * 0.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(SIZE * 0.17, side * SIZE * 0.24, SIZE * 0.08, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawSnake(t, now) {
    // position of every segment, slid between its old and new cell
    const pts = snake.map((s, i) => {
      const o = prev[Math.min(i, prev.length - 1)];
      return { x: (lerp(o.x, s.x, t) + 0.5) * SIZE, y: (lerp(o.y, s.y, t) + 0.5) * SIZE };
    });
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.save();
    ctx.shadowColor = '#12b886';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#0ca678';
    ctx.lineWidth = SIZE * 0.82;
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#63e6be';
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = SIZE * 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawHead(pts[0], now);
  }

  function drawParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx * 2; p.y += p.vy * 2; p.life -= 0.03;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 * p.life + 1, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ----- Main loop: runs every screen frame so movement is smooth -----
  function frame(now) {
    if (running && now - lastStep >= stepMs) step(now);
    const t = running ? Math.min(1, Math.max(0, (now - lastStep) / stepMs)) : 1;

    drawSpace(now);
    drawFood(now);
    drawSnake(t, now);
    drawParticles();

    if (over) {
      ctx.fillStyle = 'rgba(0,0,10,.5)';
      ctx.fillRect(0, 0, W, W);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 64px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', W / 2, W / 2);
    }
    requestAnimationFrame(frame);
  }

  // ----- Steering (queue up to 2 turns so quick swipes feel right) -----
  function turn(x, y) {
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((x === -last.x && y === -last.y) || (x === last.x && y === last.y)) return;
    if (queue.length < 2) queue.push({ x, y });
  }

  let startX = 0, startY = 0;
  document.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    if (!running) start();
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (!running && (k === ' ' || k.startsWith('Arrow'))) start();
    if (k === 'ArrowUp') turn(0, -1);
    if (k === 'ArrowDown') turn(0, 1);
    if (k === 'ArrowLeft') turn(-1, 0);
    if (k === 'ArrowRight') turn(1, 0);
  });
  document.addEventListener('mousedown', () => { if (!running) start(); });

  reset();
  requestAnimationFrame(frame);
</script>
</body>
</html>
